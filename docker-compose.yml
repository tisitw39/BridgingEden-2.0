services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bridgingeden
      POSTGRES_PASSWORD: bridgingeden
      POSTGRES_DB: bridgingeden
      BRIDGINGEDEN_OWNER_PASSWORD: ${BRIDGINGEDEN_OWNER_PASSWORD:-}
      BRIDGINGEDEN_APP_PASSWORD: ${BRIDGINGEDEN_APP_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bridgingeden-pg:/var/lib/postgresql/data
      - ./docker/init.sh:/docker-entrypoint-initdb.d/001-init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridgingeden -d bridgingeden"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  bridgingeden-pg:
